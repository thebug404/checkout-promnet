services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CYBERSOURCE_MERCHANT_ID: ${CYBERSOURCE_MERCHANT_ID}
      CYBERSOURCE_KEY_ID: ${CYBERSOURCE_KEY_ID}
      CYBERSOURCE_SECRET_KEY: ${CYBERSOURCE_SECRET_KEY}
    volumes:
      # Persist JSON data store across container restarts
      - api-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      # Build context is the monorepo root (needed for packages/wc-unified-checkout)
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
      - "8443:8443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
